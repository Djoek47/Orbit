      <span style="font-size: 11px; font-weight: 600; letter-spacing: 1.3px; color: #46617F;">ONE BREATH · 3 THINGS</span>

    <span style="font-size: 11px; font-weight: 600; letter-spacing: 1.3px; color: #46617F;">85 LEFT</span>

    <div style="width: 100%; padding: 5px; border-radius: 30px; border: 2px solid rgba(15,111,85,0.45); box-sizing: border-box; box-shadow: 0 14px 40px rgba(15,28,42,0.10);">
      <div style="width: 100%; box-sizing: border-box; border-radius: 25px; background: rgba(255,255,255,0.92); border: 1px solid rgba(11,27,46,0.07); overflow: hidden;">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F6F55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h3l2.2 10.5a2 2 0 0 0 2 1.6h6.3a2 2 0 0 0 2-1.5L21 8H7.2"></path><circle cx="11" cy="20" r="1.2"></circle><circle cx="18" cy="20" r="1.2"></circle></svg>
          <span style="flex-grow: 1; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #0F6F55;">GROCERIES</span>
          <span style="font-size: 12px; color: #46617F;">3 items</span>
        </div>

        <div style="padding: 0 10px 12px; display: flex; flex-direction: column; gap: 3px;">
          <div style="display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 17px; background: rgba(11,27,46,0.035);">

            </span>
            <span style="flex-grow: 1; font-size: 19px; font-weight: 600; line-height: 24px;">Milk</span>
            <span style="font-size: 12px; color: #46617F;">Dairy</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 17px; background: rgba(11,27,46,0.035);">

              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"></path></svg>
            </span>
            <span style="flex-grow: 1; font-size: 19px; font-weight: 600; line-height: 24px;">Eggs</span>
            <span style="font-size: 12px; color: #46617F;">Dairy</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 17px; background: rgba(11,27,46,0.055);">
            <span style="width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid rgba(11,27,46,0.18); flex-shrink: 0;"></span>
            <span style="flex-grow: 1; font-size: 19px; font-weight: 600; line-height: 24px;">Bread</span>
            <button type="button" aria-label="Drop bread" style="width: 44px; height: 44px; margin: -7px 0; border-radius: 999px; background: transparent; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <span style="width: 30px; height: 30px; border-radius: 999px; border: 1px solid rgba(11,27,46,0.12); display: flex; align-items: center; justify-content: center;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#46617F" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </span>
            </button>
          </div>
        </div>

        <div style="padding: 12px 18px 14px; border-top: 1px solid rgba(11,27,46,0.06); display: flex; flex-direction: column; gap: 9px;">
          <div style="width: 100%; height: 3px; border-radius: 999px; background: rgba(11,27,46,0.10); overflow: hidden;">
            <div style="width: 78%; height: 3px; border-radius: 999px; background: #0F6F55;"></div>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span style="font-size: 12px; color: #46617F;">One hold for all three</span>
            <span style="font-size: 12px; color: #46617F;">tap × to drop one</span>
          </div>
        </div>
      </div>
    </div>

    <span style="font-size: 12px; line-height: 17px; color: #46617F; text-align: center; max-width: 300px;">Daylight keeps every shape. Only the ground, the greens and the shadow change — the ring, the rows and the single mark are identical.</span>

  <div style="padding: 0 22px 30px; display: flex; align-items: center; justify-content: center; gap: 20px; position: relative;">
    <button type="button" aria-label="Type instead" style="width: 54px; height: 54px; border-radius: 18px; background: rgba(255,255,255,0.88); border: 1px solid rgba(11,27,46,0.09); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#46617F" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"></path></svg>

    <button type="button" aria-label="Speak" style="width: 82px; height: 82px; border-radius: 999px; background: #0F6F55; border: 3px solid rgba(15,111,85,0.18); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 28px rgba(15,111,85,0.28);">
